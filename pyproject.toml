[project]
name = "mautg"
version = "2.4"
description = "Play Mau with your friends in Telegram chats!"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20.0",
    "fastapi>=0.115.12",
    "mau>=2.3",
    "pydantic-settings>=2.9.1",
    "uvicorn>=0.34.2",
]

[dependency-groups]
dev = ["mypy>=1.15.0", "pyright>=1.1.405", "ruff>=0.13.0"]


# Ruff linter ----------------------------------------------------------

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D407",
    "D107",
    "D213",
    "D203",
    "RUF",
    "COM",    # trailing commas, controlled by format
    "EM102",  #  Exception must not use an f-string literal, assign to variable first
    "TRY003", # Avoid specifying long messages outside the exception class
    "INP001", # part of an implicit namespace package. Add an `__init__.py`.
    "FIX",    # Line contains TODO, consider resolving the
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link for this TODO
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
mau = { git = "https://github.com/miroqru/mauno" }
